<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | HireHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F2A44, #4FB6E8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(79, 182, 232, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #0F2A44;
            font-size: 28px;
        }

        .reset-card h4 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .reset-card p {
            text-align: center;
            color: #6B7280;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 12px;
        }

        .btn-reset {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0F2A44, #2E3A46);
            color: #fff;
            font-weight: 600;
            border: none;
        }

        .btn-reset:hover {
            opacity: 0.95;
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
        }

        .back-link a {
            text-decoration: none;
            font-weight: 600;
            color: #0F2A44;
        }
    </style>
</head>
<body>

<div class="reset-card">
    <div class="icon-circle">
        <i class="bi bi-shield-lock"></i>
    </div>

    <h4>Forgot your password?</h4>
    <p>
        Enter your registered email address and we’ll send you a secure link
        to reset your password.
    </p>
    {% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-success text-center">
      {{ messages[0] }}
    </div>
  {% endif %}
{% endwith %}


    <form method="POST" id="resetForm">
        <div class="mb-3">
            <label class="form-label fw-semibold">Email address</label>
            <input type="email" name="email" id="emailInput" class="form-control" placeholder="you@example.com" 
                   value="{{ reset_email }}" required>
        </div>

        <button type="submit" class="btn btn-reset" id="submitBtn">
            <span id="btnText">{{ 'Resend Reset Link' if reset_email else 'Send Reset Link' }}</span>
            <span id="countdown" style="display: none;"></span>
        </button>
    </form>

    <script>
        let timeRemaining = {{ time_remaining }};
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const countdown = document.getElementById('countdown');

        function updateButton() {
            if (timeRemaining > 0) {
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.6';
                submitBtn.style.cursor = 'not-allowed';
                btnText.style.display = 'none';
                countdown.style.display = 'inline';
                countdown.textContent = `Resend in ${timeRemaining}s`;
                timeRemaining--;
                setTimeout(updateButton, 1000);
            } else {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                submitBtn.style.cursor = 'pointer';
                btnText.style.display = 'inline';
                countdown.style.display = 'none';
                if (document.getElementById('emailInput').value) {
                    btnText.textContent = 'Resend Reset Link';
                }
            }
        }

        if (timeRemaining > 0) {
            updateButton();
        }
    </script>

    <div class="back-link">
        <a href="/login"><i class="bi bi-arrow-left"></i> Back to Login</a>
    </div>
</div>
{% raw %}
<script>
    (function () {
        if (window.__professionalAlertInstalled) return;
        window.__professionalAlertInstalled = true;
        const style = document.createElement('style');
        style.textContent = `#pro-alert-container{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:12px;max-width:min(420px,calc(100vw - 24px));}.pro-alert{background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(15,42,68,.18);border-left:5px solid #4FB6E8;padding:14px 14px 14px 16px;color:#1F2933;font:500 14px/1.45 Inter,Segoe UI,sans-serif;transform:translateY(-10px);opacity:0;transition:all .22s ease;white-space:pre-line;display:flex;gap:10px;align-items:flex-start;}.pro-alert.show{opacity:1;transform:translateY(0);}.pro-alert.success{border-left-color:#10b981;}.pro-alert.error{border-left-color:#ef4444;}.pro-alert.warning{border-left-color:#f59e0b;}.pro-alert .icon{font-size:16px;margin-top:1px;}.pro-alert .content{flex:1;}.pro-alert .close-btn{border:0;background:transparent;color:#64748b;font-size:18px;line-height:1;cursor:pointer;padding:0 2px;}@media (max-width:768px){#pro-alert-container{left:10px;right:10px;top:10px;max-width:none;}}`;
        document.head.appendChild(style);
        const typeOf = (message) => { const text = String(message || '').toLowerCase(); if (text.includes('error') || text.includes('failed') || text.includes('not found') || text.includes('could not')) return 'error'; if (text.includes('warning') || text.includes('please') || text.includes('required') || text.includes('invalid')) return 'warning'; if (text.includes('success') || text.includes('submitted') || text.includes('saved') || text.includes('generated') || text.includes('approved')) return 'success'; return 'info'; };
        const iconOf = (type) => type === 'success' ? '✅' : (type === 'error' || type === 'warning') ? '⚠️' : 'ℹ️';
        window.alert = function (message) { let container = document.getElementById('pro-alert-container'); if (!container) { container = document.createElement('div'); container.id = 'pro-alert-container'; document.body.appendChild(container); } const type = typeOf(message); const toast = document.createElement('div'); toast.className = `pro-alert ${type}`; toast.innerHTML = `<div class="icon">${iconOf(type)}</div><div class="content">${String(message || '')}</div><button class="close-btn" aria-label="Close">×</button>`; container.appendChild(toast); requestAnimationFrame(() => toast.classList.add('show')); const close = () => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 220); }; toast.querySelector('.close-btn').addEventListener('click', close); setTimeout(close, 5000); };
    })();
</script>
{% endraw %}
</body>
</html>
