<!-- Reset Password.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width: 400px;">
        <h4 class="text-center mb-3">Reset Password</h4>

        <form method="POST">
            <div class="mb-3">
                <label>New Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button class="btn btn-success w-100">Reset Password</button>
        </form>
    </div>
</div>
{% raw %}
<script>
    (function () {
        if (window.__professionalAlertInstalled) return;
        window.__professionalAlertInstalled = true;
        const style = document.createElement('style');
        style.textContent = `#pro-alert-container{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:12px;max-width:min(420px,calc(100vw - 24px));}.pro-alert{background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(15,42,68,.18);border-left:5px solid #4FB6E8;padding:14px 14px 14px 16px;color:#1F2933;font:500 14px/1.45 Inter,Segoe UI,sans-serif;transform:translateY(-10px);opacity:0;transition:all .22s ease;white-space:pre-line;display:flex;gap:10px;align-items:flex-start;}.pro-alert.show{opacity:1;transform:translateY(0);}.pro-alert.success{border-left-color:#10b981;}.pro-alert.error{border-left-color:#ef4444;}.pro-alert.warning{border-left-color:#f59e0b;}.pro-alert .icon{font-size:16px;margin-top:1px;}.pro-alert .content{flex:1;}.pro-alert .close-btn{border:0;background:transparent;color:#64748b;font-size:18px;line-height:1;cursor:pointer;padding:0 2px;}@media (max-width:768px){#pro-alert-container{left:10px;right:10px;top:10px;max-width:none;}}`;
        document.head.appendChild(style);
        const typeOf = (message) => { const text = String(message || '').toLowerCase(); if (text.includes('error') || text.includes('failed') || text.includes('not found') || text.includes('could not')) return 'error'; if (text.includes('warning') || text.includes('please') || text.includes('required') || text.includes('invalid')) return 'warning'; if (text.includes('success') || text.includes('submitted') || text.includes('saved') || text.includes('generated') || text.includes('approved')) return 'success'; return 'info'; };
        const iconOf = (type) => type === 'success' ? '✅' : (type === 'error' || type === 'warning') ? '⚠️' : 'ℹ️';
        window.alert = function (message) { let container = document.getElementById('pro-alert-container'); if (!container) { container = document.createElement('div'); container.id = 'pro-alert-container'; document.body.appendChild(container); } const type = typeOf(message); const toast = document.createElement('div'); toast.className = `pro-alert ${type}`; toast.innerHTML = `<div class="icon">${iconOf(type)}</div><div class="content">${String(message || '')}</div><button class="close-btn" aria-label="Close">×</button>`; container.appendChild(toast); requestAnimationFrame(() => toast.classList.add('show')); const close = () => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 220); }; toast.querySelector('.close-btn').addEventListener('click', close); setTimeout(close, 5000); };
    })();
</script>
{% endraw %}
</body>
</html>
