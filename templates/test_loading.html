<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating Your Test | HireHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0F2A44;
            --primary-dark: #0A1F33;
            --primary-light: #1A3A5A;
            --secondary: #2E3A46;
            --secondary-dark: #1F2933;
            --secondary-light: #3D4A56;
            --accent: #4FB6E8;
            --accent-dark: #3A9FD5;
            --accent-light: #6BC5ED;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --background: #F6F8FB;
            --card: #FFFFFF;
            --text-primary: #1F2933;
            --text-secondary: #6B7280;
            --border: #E5EAF0;
            --dark: #0F2A44;
            --gray: #6B7280;
            --light: #F6F8FB;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background: var(--light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
        }

        .loading-container {
            max-width: 700px;
            width: 100%;
            padding: 2rem;
        }

        .loading-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(15, 42, 68, 0.15);
            border: 2px solid var(--border);
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            box-shadow: 0 10px 30px rgba(15, 42, 68, 0.3);
        }

        .loading-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
            color: var(--primary);
            animation: fadeIn 0.5s ease-in;
        }

        .loading-subtitle {
            font-size: 1rem;
            color: var(--gray);
            margin-bottom: 2.5rem;
            animation: fadeIn 0.5s ease-in 0.2s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-container {
            background: rgba(15, 42, 68, 0.1);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 2.5rem;
            animation: fadeIn 0.5s ease-in 0.4s backwards;
        }

        .progress-bar-custom {
            height: 12px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(15, 42, 68, 0.4);
        }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
            animation: fadeIn 0.5s ease-in 0.6s backwards;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 1.5rem;
            background: var(--light);
            border-radius: 12px;
            border: 2px solid var(--border);
            transition: all 0.3s ease;
            text-align: left;
        }

        .step.active {
            background: rgba(79, 182, 232, 0.1);
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(79, 182, 232, 0.2);
        }

        .step.completed {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
        }

        .step-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: white;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--gray);
            flex-shrink: 0;
        }

        .step.active .step-icon {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            animation: pulse 2s ease-in-out infinite;
        }

        .step.completed .step-icon {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .step-text {
            flex: 1;
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
        }

        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .brand-footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--gray);
            font-size: 0.9rem;
            animation: fadeIn 0.5s ease-in 0.8s backwards;
        }

        .brand-logo {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }

        @media (max-width: 768px) {
            .loading-card {
                padding: 2rem 1.5rem;
            }
            
            .loading-title {
                font-size: 1.5rem;
            }
            
            .ai-icon {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
            }
        }
        /* ========== AI TEST LOADING – MOBILE FIX ========== */
        
        @media (max-width: 576px) {
        
            body {
                padding: 10px;
            }
        
            .loading-container {
                padding: 0;
            }
        
            .loading-card {
                padding: 1.5rem 1.2rem;
                border-radius: 16px;
            }
        
            .ai-icon {
                width: 70px;
                height: 70px;
                font-size: 2.2rem;
                margin-bottom: 1.5rem;
            }
        
            .loading-title {
                font-size: 1.3rem;
            }
        
            .loading-subtitle {
                font-size: 0.9rem;
                margin-bottom: 2rem;
            }
        
            .progress-container {
                margin-bottom: 2rem;
            }
        
            .step {
                padding: 0.9rem 1rem;
                gap: 0.75rem;
            }
        
            .step-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }
        
            .step-text {
                font-size: 0.9rem;
                line-height: 1.4;
            }
        
            .spinner {
                width: 18px;
                height: 18px;
                border-width: 2px;
            }
        
            .brand-footer {
                font-size: 0.8rem;
                margin-top: 1.5rem;
            }
        }

    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-card">
            <div class="ai-icon">
                <i class="bi bi-cpu"></i>
            </div>
            
            <h1 class="loading-title">AI is Crafting Your Test</h1>
            <p class="loading-subtitle">Analyzing your skills and generating personalized questions...</p>
            
            <div class="progress-container">
                <div class="progress-bar-custom" id="progressBar"></div>
            </div>

            <div class="steps-container">
                <div class="step" id="step1">
                    <div class="step-icon">
                        <i class="bi bi-person-check"></i>
                    </div>
                    <div class="step-text">Analyzing your profile</div>
                    <div class="spinner"></div>
                </div>
                
                <div class="step" id="step2">
                    <div class="step-icon">
                        <i class="bi bi-cpu"></i>
                    </div>
                    <div class="step-text">Generating AI-powered questions</div>
                </div>
                
                <div class="step" id="step3">
                    <div class="step-icon">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <div class="step-text">Preparing your test</div>
                </div>
            </div>
        </div>

        <div class="brand-footer">
            <div class="brand-logo">HireHub</div>
            <div>Powered by AI Technology</div>
        </div>
    </div>

    <script>
        let progress = 0;
        let currentStep = 1;
        const testId = {{ test_id }};
        
        // Animate progress bar
        const progressBar = document.getElementById('progressBar');
        const progressInterval = setInterval(() => {
            if (progress < 90) {
                progress += Math.random() * 3;
                progressBar.style.width = Math.min(progress, 90) + '%';
            }
        }, 200);

        // Animate steps
        function updateStep(stepNum) {
            const prevStep = document.getElementById(`step${stepNum - 1}`);
            const currentStep = document.getElementById(`step${stepNum}`);
            
            if (prevStep) {
                prevStep.classList.remove('active');
                prevStep.classList.add('completed');
                prevStep.querySelector('.spinner')?.remove();
                prevStep.querySelector('.step-icon').innerHTML = '<i class="bi bi-check"></i>';
            }
            
            if (currentStep) {
                currentStep.classList.add('active');
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                currentStep.appendChild(spinner);
            }
        }

        // Progress through steps
        setTimeout(() => updateStep(2), 1500);
        setTimeout(() => updateStep(3), 3000);

        // Poll for test readiness
        let pollAttempts = 0;
        const maxPollAttempts = 20; // Stop after 20 attempts (20 seconds)
        
        function checkTestReady() {
            pollAttempts++;
            
            fetch(`/check-test-ready/${testId}`)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else if (response.status === 503) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.error || 'Service unavailable');
                        });
                    } else {
                        throw new Error('Failed to check test readiness');
                    }
                })
                .then(data => {
                    if (data.ready) {
                        clearInterval(progressInterval);
                        clearInterval(pollInterval);
                        
                        // Complete progress
                        progressBar.style.width = '100%';
                        
                        // Mark all steps as completed
                        updateStep(4);
                        
                        // Redirect to test
                        setTimeout(() => {
                            window.location.href = `/take-ai-test/${testId}`;
                        }, 500);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    
                    // Stop polling after max attempts or on quota error
                    if (pollAttempts >= maxPollAttempts || error.message.includes('daily limit') || error.message.includes('quota')) {
                        clearInterval(progressInterval);
                        clearInterval(pollInterval);
                        
                        // Show error message to user
                        const stepsContainer = document.querySelector('.steps-container');
                        stepsContainer.innerHTML = `
                            <div style="text-align: center; padding: 2rem;">
                                <div style="font-size: 3rem; color: #dc3545; margin-bottom: 1rem;">
                                    <i class="bi bi-exclamation-triangle"></i>
                                </div>
                                <h3 style="color: #dc3545; margin-bottom: 1rem;">Unable to Generate Test</h3>
                                <p style="color: #6c757d; margin-bottom: 1.5rem; line-height: 1.6;">
                                    ${error.message}
                                </p>
                                <a href="/candidate-dashboard" class="btn btn-primary" style="padding: 0.75rem 2rem; text-decoration: none;">
                                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                                </a>
                            </div>
                        `;
                        
                        document.querySelector('.loading-title').textContent = 'Service Temporarily Unavailable';
                        document.querySelector('.loading-subtitle').textContent = 'Please try again later';
                        progressBar.style.backgroundColor = '#dc3545';
                    }
                });
        }

        // Start polling after 2 seconds
        const pollInterval = setInterval(checkTestReady, 1000);
    </script>

        document.head.appendChild(style);
        const typeOf = (message) => { const text = String(message || '').toLowerCase(); if (text.includes('error') || text.includes('failed') || text.includes('not found') || text.includes('could not')) return 'error'; if (text.includes('warning') || text.includes('please') || text.includes('required') || text.includes('invalid')) return 'warning'; if (text.includes('success') || text.includes('submitted') || text.includes('saved') || text.includes('generated') || text.includes('approved')) return 'success'; return 'info'; };
        const iconOf = (type) => type === 'success' ? '✅' : (type === 'error' || type === 'warning') ? '⚠️' : 'ℹ️';
        window.alert = function (message) { let container = document.getElementById('pro-alert-container'); if (!container) { container = document.createElement('div'); container.id = 'pro-alert-container'; document.body.appendChild(container); } const type = typeOf(message); const toast = document.createElement('div'); toast.className = `pro-alert ${type}`; toast.innerHTML = `<div class="icon">${iconOf(type)}</div><div class="content">${String(message || '')}</div><button class="close-btn" aria-label="Close">×</button>`; container.appendChild(toast); requestAnimationFrame(() => toast.classList.add('show')); const close = () => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 220); }; toast.querySelector('.close-btn').addEventListener('click', close); setTimeout(close, 5000); };
